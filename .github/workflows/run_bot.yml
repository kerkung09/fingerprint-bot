name: Fingerprint Bot Runner

on:
  schedule:
    - cron: '55 0 * * *'   # 07:55 ไทย (กะเช้า รอบ 1)
    - cron: '30 1 * * *'   # 08:30 ไทย (กะเช้า รอบ 2)
    - cron: '55 12 * * *'  # 19:55 ไทย (กะดึก รอบ 1)
    - cron: '30 13 * * *'  # 20:30 ไทย (กะดึก รอบ 2)
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Bangkok
      LINE_TOKEN: ${{ secrets.LINE_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests openpyxl numbers-parser

      # ตัดสินกะจาก cron ที่ trigger (ไม่ขึ้นกับว่ารันช้าแค่ไหน)
      - name: Run script for current shift
        env:
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ "$SCHEDULE" = "55 0 * * *" ] || [ "$SCHEDULE" = "30 1 * * *" ]; then
            python app.py day
          elif [ "$SCHEDULE" = "55 12 * * *" ] || [ "$SCHEDULE" = "30 13 * * *" ]; then
            python app.py night
          else
            # กดรันเอง (workflow_dispatch): ก่อนเที่ยง = day, หลังเที่ยง = night
            HOUR=$(date +%H)
            if [ "$HOUR" -lt 12 ]; then python app.py day; else python app.py night; fi
          fi
