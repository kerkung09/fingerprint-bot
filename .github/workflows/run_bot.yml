name: Fingerprint Bot Runner

on:
  schedule:
    # ตั้งเวลาปลุกสคริปต์ขึ้นมาทำงาน 1 รอบต่อวัน (เช่น ปลุกตอน 07:50 น. เวลาไทย)
    - cron: '50 0 * * *'
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest
    timeout-minutes: 240  # อนุญาตให้รันค้างไว้ได้สูงสุด 4 ชั่วโมง
    env:
      TZ: Asia/Bangkok

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests openpyxl

      # รันในโหมด auto ให้มันสแตนด์บายวนเช็กเวลา 07:55, 08:30, 19:55, 20:30 ในวันนั้น
      - name: Run script auto loop
        run: python app.py auto

      # บันทึกไฟล์ shifts.db กลับเข้า GitHub หลังจาก loop ทำงานเสร็จสิ้นในแต่ละวัน
      - name: Commit and push shifts.db updates
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add shifts.db
          git diff --quiet && git diff --staged --quiet || (git commit -m "auto: update shifts.db history" && git push)
