name: Fingerprint Bot Runner

on:
  schedule:
    - cron: '55 0 * * *'   # 07:55 น. ไทย (กะเช้า รอบ 1)
    - cron: '30 1 * * *'   # 08:30 น. ไทย (กะเช้า รอบ 2)
    - cron: '55 12 * * *'  # 19:55 น. ไทย (กะดึก รอบ 1)
    - cron: '30 13 * * *'  # 20:30 น. ไทย (กะดึก รอบ 2)
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Bangkok

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests openpyxl

      # คำนวณช่วงเวลาอัตโนมัติ: ถ้าก่อนเที่ยงรัน day ถ้าหลังเที่ยงรัน night
      - name: Run script for current shift
        run: |
          HOUR=$(date +%H)
          if [ "$HOUR" -lt 12 ]; then
            python app.py day
          else
            python app.py night
          fi

      # บันทึกไฟล์ shifts.db กลับเข้า GitHub
      - name: Commit and push shifts.db updates
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add shifts.db
          git diff --quiet && git diff --staged --quiet || (git commit -m "auto: update shifts.db history" && git push)
