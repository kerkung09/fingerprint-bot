name: Fingerprint Bot Runner

on:
  schedule:
    # ตั้งเวลาให้รันทุกๆ 1 ชั่วโมง (เวลา UTC จะช้ากว่าไทย 7 ชม.)
    - cron: '0 * * * *'
  workflow_dispatch: 

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run script
        run: python app.py
