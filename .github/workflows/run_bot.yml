name: Fingerprint Bot Runner

on:
  schedule:
    # ตั้งเวลา UTC (ช้ากว่าไทย 7 ชม.)
    # 00:55 UTC = 07:55 น. ไทย
    - cron: '55 0 * * *'
    # 01:30 UTC = 08:30 น. ไทย
    - cron: '30 1 * * *'
    # 12:55 UTC = 19:55 น. ไทย
    - cron: '55 12 * * *'
    # 13:30 UTC = 20:30 น. ไทย
    - cron: '30 13 * * *'
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests openpyxl

      - name: Run script
        run: python app.py day
