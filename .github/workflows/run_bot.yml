name: Fingerprint Bot Runner

on:
  schedule:
    - cron: '55 0 * * *'
    - cron: '30 1 * * *'
    - cron: '55 12 * * *'
    - cron: '30 13 * * *'
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Bangkok # ตั้งค่า Timezone ให้เป็นเวลาไทย

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests openpyxl

      # บังคับรันกะเช้า (day) เพื่อทดสอบทันที
      - name: Run script test (Day Shift)
        run: python app.py day

      # บันทึกไฟล์ shifts.db กลับเข้า GitHub เพื่อให้ข้อมูลประวัติกะไม่หายไปในรอบถัดไป
      - name: Commit and push shifts.db updates
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add shifts.db
          git diff --quiet && git diff --staged --quiet || (git commit -m "auto: update shifts.db history" && git push)
