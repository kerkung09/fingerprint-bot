name: Fingerprint Bot Runner

on:
  schedule:
    - cron: '40 23 * * 0-5'  # 06:40 ไทย จ-ส (กะเช้า รอบ 1)
    - cron: '10 0 * * 1-6'   # 07:10 ไทย จ-ส (กะเช้า รอบ 2)
    - cron: '40 11 * * 1-6'  # 18:40 ไทย จ-ส (กะดึก รอบ 1)
    - cron: '10 12 * * 1-6'  # 19:10 ไทย จ-ส (กะดึก รอบ 2)
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: Asia/Bangkok
      LINE_TOKEN: ${{ secrets.LINE_TOKEN }}
      LINE_GROUP_ID: ${{ secrets.LINE_GROUP_ID }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests openpyxl

      - name: Test connectivity
        continue-on-error: true
        run: |
          echo "LINE_TOKEN length: ${#LINE_TOKEN}"
          curl -sS -m 10 -o /dev/null -w "calcomp: HTTP %{http_code}\n" https://webapp.calcomp.co.th/att/ || echo "calcomp: UNREACHABLE from GitHub runner"
          curl -sS -m 10 -o /dev/null -w "line: HTTP %{http_code} (401 is normal here)\n" https://api.line.me/v2/bot/info || echo "line: UNREACHABLE"

      - name: Run script for current shift
        env:
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ "$SCHEDULE" = "40 23 * * 0-5" ] || [ "$SCHEDULE" = "10 0 * * 1-6" ]; then
            python app.py day
          elif [ "$SCHEDULE" = "40 11 * * 1-6" ] || [ "$SCHEDULE" = "10 12 * * 1-6" ]; then
            python app.py night
          else
            # กดรันเอง: ก่อนเที่ยง = day, หลังเที่ยง = night
            HOUR=$(date +%H)
            if [ "$HOUR" -lt 12 ]; then python app.py day; else python app.py night; fi
          fi
